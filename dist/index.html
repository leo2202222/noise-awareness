};
const devices=[];

let selectedDevice=devices[0],eventPage=1,view='daily',uiLanguage=localStorage.getItem('noise-language')||'en',liveSnapshot=null,dataConnection='connecting',lastDataError='',hasLoadedRealData=false,usingMockData=false,lastDatabaseRetry=0,authUser=null;

function escapeNotificationText(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function updateNotifications(){let list=document.getElementById('notificationList'),count=document.getElementById('notificationCount');if(!list||!count)return;let alerts=notificationAlerts(),read=readNotificationIds(),unread=alerts.filter(({event})=>!read.has(notificationId(event))).length,thai=uiLanguage==='th';document.getElementById('notificationToggle').setAttribute('aria-label',thai?`การแจ้งเตือน ${unread} รายการยังไม่ได้อ่าน`:`Notifications, ${unread} unread`);document.getElementById('notificationTitle').textContent=thai?'การแจ้งเตือน':'Notifications';document.getElementById('notificationSummary').textContent=unread?(thai?`${unread} รายการใหม่`:`${unread} new`):(thai?'ไม่มีรายการใหม่':'All caught up');document.getElementById('notificationAll').textContent=thai?'ดูประวัติเหตุการณ์':'View event history';count.hidden=!unread;count.textContent=unread>9?'9+':String(unread);list.innerHTML=alerts.length?alerts.slice(0,10).map(({event,index})=>`<button class="notification-item ${read.has(notificationId(event))?'is-read':''}" type="button" data-notification-event="${index}"><span class="notification-dot" aria-hidden="true"></span><span><strong>${thai?'แจ้งเตือน':'Alert'} · ${escapeNotificationText(event.type)}</strong><small>${escapeNotificationText(event.device)} · ${escapeNotificationText(event.date)} ${escapeNotificationText(event.time)} · ~${escapeNotificationText(event.level)} dB</small></span></button>`).join(''):`<div class="notification-empty">${thai?'ยังไม่มีการแจ้งเตือนจากอุปกรณ์':'No device alerts yet'}</div>`}
const updateNotificationsWithUnreadState=updateNotifications;

  updateNotificationsWithUnreadState();
  let count=document.getElementById('notificationCount'),total=notificationAlerts().length;
  if(!count)return;

  count.textContent=total>9?'9+':String(total)
};

function head(kicker,title,copy,actions=''){if(kicker==='Current overview'){kicker=tr('Your space today','พื้นที่ของคุณวันนี้');title=title.replace('<span id="timeGreeting">',`<span id="greetingEmoji" class="greeting-emoji" aria-hidden="true">${greetingEmoji()}</span><span id="timeGreeting">`);if(copy==='A calm overview of the latest environmental sound activity.')copy=tr('A gentle look at what’s happening around you.','มาดูบรรยากาศรอบตัวแบบสบาย ๆ กัน')}return `<div class="page-head"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1><p>${copy}</p></div>${actions?`<div class="toolbar">${actions}</div>`:''}</div>`}
function overview(){let d=selectedDevice;return `<section class="device-context ${d.online?'live':'offline'}" aria-label="Current device context"><div class="context-main"><span class="context-icon" data-icon="device"></span><div><span class="context-label">Viewing device</span><strong>${d.name}</strong><span class="context-location">${d.location} · ${d.id}</span></div></div><div class="context-actions"><div class="mini-mascot-row"><div class="mini-mascot-copy" id="mascotBubble">${d.online?'Everything feels calm':'Last reading is safe'}</div><div class="mascot mini-mascot" id="mascot" role="button" tabindex="0" aria-label="Play with Mimi"><span class="sound-ring"></span><span class="sound-ring r2"></span><span class="mascot-face">🐰</span><span class="music-note" aria-hidden="true">♪</span><span class="emoji-spark spark-1" aria-hidden="true">✨</span><span class="emoji-spark spark-2" aria-hidden="true">🎵</span><span class="emoji-spark spark-3" aria-hidden="true">💚</span><span class="mascot-status">${d.online?'✓':'!'}</span></div></div><div class="context-state"><span class="state-pill"><span class="dot"></span>${d.online?'Live':'Offline'}</span><span class="context-updated">${d.online?'Receiving data now':`Last received ${d.updated}`}</span></div></div></section>`}
function bangkokHour(){return Number(new Intl.DateTimeFormat('en-US',{hour:'2-digit',hour12:false,timeZone:'Asia/Bangkok'}).format(new Date()).split(':')[0])%24}
const tr=(en,th)=>uiLanguage==='th'?th:en;
function historyCoverageText(){const info=liveSnapshot?.historyInfo;if(!info)return tr('Waiting for history data.','Waiting for history data.');const stamp=new Date(info.refreshedAt).toLocaleString(uiLanguage==='th'?'th-TH':'en-GB',{timeZone:'Asia/Bangkok'});return (info.possiblyTruncated?tr('Query limit reached: statistics cover the loaded subset only. ','Query limit reached: statistics cover the loaded subset only. '):tr('Statistics cover retained records returned by ThingsBoard. ','Statistics cover retained records returned by ThingsBoard. '))+tr('History refreshed: ','History refreshed: ')+stamp}
function eventTimestamp(event){if(event.ts)return Number(event.ts);let parsed=Date.parse(`${event.date||''} ${event.time||''}`);return Number.isFinite(parsed)?parsed:0}
function telemetrySeries(){let raw=liveSnapshot?.soundLevels||liveSnapshot?.recentSoundLevels||liveSnapshot?.telemetry||[];return raw.map((item,index)=>({ts:Number(item.ts??item.timestamp),value:Number(item.value??item.level??item.approximateSoundLevel)})).filter(item=>Number.isFinite(item.ts)&&item.ts>0&&Number.isFinite(item.value)).sort((a,b)=>a.ts-b.ts).slice(-24)}
function greetingEmoji(){let hour=bangkokHour();return hour>=5&&hour<12?'🌤️':hour>=12&&hour<17?'☀️':hour>=17&&hour<22?'🌇':'🌙'}
function timeGreeting(){let h=bangkokHour();if(uiLanguage==='th')return h>=5&&h<12?'สวัสดีตอนเช้า':h>=12&&h<17?'สวัสดีตอนบ่าย':h>=17&&h<22?'สวัสดีตอนเย็น':'ราตรีสวัสดิ์';return h>=5&&h<12?'Good morning':h>=12&&h<17?'Good afternoon':h>=17&&h<22?'Good evening':'Good night'}

"events">View All Events</button></div></section></div><p class="help" style="margin-top:24px">Last updated: ${selectedDevice.updated} ICT${off?' · These are the last readings received before the device went offline.':''}</p>`}
function lineChart(){return `<div class="chart"></div>`}
const dashboardWithDevice=dashboard;

function eventDateValue(label){const months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'},[day,month,year]=label.split(' ');return `${year}-${months[month]}-${day}`}
function filteredEvents(){let range=document.querySelector('#fDate')?.value||'last7',specific=document.querySelector('#fSpecificDate')?.value||'',dev=document.querySelector('#fDevice')?.value||'',type=document.querySelector('#fType')?.value||'',status=document.querySelector('#fStatus')?.value||'',today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return events.filter(e=>{let eventDay=eventDateValue(e.date),days=(new Date(`${today}T00:00:00`)-new Date(`${eventDay}T00:00:00`))/86400000,dateMatch=range==='specific'?(!specific||eventDay===specific):range==='today'?eventDay===today:range==='last30'?days>=0&&days<30:days>=0&&days<7;return dateMatch&&(!dev||e.device===dev)&&(!type||e.type===type)&&(!status||e.status===status)})}
function eventRows(list){return list.map((e,i)=>`<tr data-event="${events.indexOf(e)}" tabindex="0" role="button" aria-label="Open ${e.type} event from ${e.device} at ${e.time}"><td>${e.date}<br><span class="help">${e.time}</span></td><td>${e.device}</td><td><b>${e.type}</b></td><td>~${e.level} dB</td><td>${e.duration}</td><td>${e.presence}</td><td>${badge(e.status)}</td></tr>`).join('')}
function mobileEvents(list){return list.map(e=>`<article class="card event-card" data-event="${events.indexOf(e)}" tabindex="0" role="button" aria-label="Open ${e.type} event from ${e.device} at ${e.time}"><div class="event-card-top"><div><h3>${e.type}</h3><p>${e.date} · ${e.time}</p></div>${badge(e.status)}</div><div class="event-card-meta"><div><small>Device</small>${e.device}</div><div><small>Approx. level</small>~${e.level} dB</div><div><small>Duration</small>${e.duration}</div><div><small>Presence</small>${e.presence}</div></div></article>`).join('')}
function eventsPage(){return `${head('Recorded activity','Event History','Real telemetry samples from ThingsBoard: up to 20,000 latest records in 49 days. Each row is a sample, not a complete sound incident.')}<section class="card filters"><div class="field"><label for="fDate">Date range</label><select class="select filter" id="fDate"><option>Last 7 days</option><option>Today</option><option>Last 30 days</option></select></div><div class="field"><label for="fDevice">Device</label><select class="select filter" id="fDevice"><option value="">All devices</option>${devices.map(d=>`<option>${d.name}</option>`).join('')}</select></div><div class="field"><label for="fType">Sound type</label><select class="select filter" id="fType"><option value="">All sound types</option><option>Speech</option><option>Music</option><option>Noise</option></select></div><div class="field"><label for="fStatus">Alert status</label><select class="select filter" id="fStatus"><option value="">All statuses</option><option>Normal</option><option>Monitor</option><option>Alert</option></select></div></section><section class="card"><div id="eventsArea">${eventsResults(events)}</div></section>`}
function eventsResults(list){if(!list.length)return `<div class="empty"><div class="empty-mascot" role="img" aria-label="Mimi the mascot">🐰</div><strong>It’s quiet here</strong>No events match these filters. Try a different selection.</div>`;let start=(eventPage-1)*5,page=list.slice(start,start+5);return `<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Device</th><th>Sound type</th><th>Approx. level</th><th>Duration</th><th>Presence</th><th>Status</th></tr></thead><tbody>${eventRows(page)}</tbody></table></div><div class="mobile-cards">${mobileEvents(page)}</div><div class="pagination"><span>Showing ${start+1}–${Math.min(start+5,list.length)} of ${list.length} events</span><div class="pages"><button data-pg="1" class="${eventPage===1?'active':''}">1</button><button data-pg="2" class="${eventPage===2?'active':''}">2</button></div></div>`}

  <script>
    (() => {
      const actionable = 'button, .btn, a.button, [role="button"], .nav-item';

      document.addEventListener('pointermove', (event) => {
        const target = event.target.closest(actionable);
        if (!target) return;
        const rect = target.getBoundingClientRect();
        target.style.setProperty('--pointer-x', `${event.clientX - rect.left}px`);
        target.style.setProperty('--pointer-y', `${event.clientY - rect.top}px`);
      }, { passive: true });

      document.addEventListener('pointerdown', (event) => {
        if (event.pointerType !== 'mouse' && event.pointerType !== 'touch' && event.pointerType !== 'pen') return;
        const target = event.target.closest(actionable);
        if (!target || target.matches('[disabled], [aria-disabled="true"]')) return;
        const rect = target.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'calm-ripple';
        ripple.style.left = `${event.clientX - rect.left}px`;
        ripple.style.top = `${event.clientY - rect.top}px`;
        target.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
      }, { passive: true });
    })();
  </script>
